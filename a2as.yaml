functions:
  __init__:
    type: sync
    module: backend.marketing_agent
    args: [self]
  _analyze_content_with_ai:
    type: async
    module: backend.agents.business_analysis_agent
    args: [self, url_contents, analysis_type]
    params:
      returns: Dict
  _build_analysis_prompt:
    type: sync
    module: backend.agents.business_analysis_agent
    args: [self, url_contents, analysis_type]
    params:
      returns: str
  _create_campaign_aware_prompt:
    type: sync
    module: backend.agents.adk_visual_agents
    args: [self, post_content, campaign_guidance, business_context]
    params:
      returns: str
  _create_campaign_aware_video_prompt:
    type: sync
    module: backend.agents.adk_visual_agents
    args: [self, post_content, campaign_guidance, business_context]
    params:
      returns: str
  _create_fallback_image_file:
    type: async
    module: backend.agents.adk_visual_agents
    args: [self, prompt, campaign_id]
    params:
      returns: Dict
  _create_fallback_video_file:
    type: async
    module: backend.agents.adk_visual_agents
    args: [self, prompt, campaign_id]
    params:
      returns: Dict
  _create_image_prompt:
    type: sync
    module: backend.agents.async_visual_manager
    args: [self, post, business_context, objective]
    params:
      returns: str
  _create_video_prompt:
    type: sync
    module: backend.agents.async_visual_manager
    args: [self, post, business_context, objective]
    params:
      returns: str
  _create_visual_job:
    type: sync
