variables:
  env_var:
    type: env
    params:
      caller: [os.getenv]
      path: ['os.path.join(os.path.dirname(__file__), ''../.env'')']
  GEMINI_API_KEY:
    type: env
    params:
      caller: [os.getenv, genai.Client, os.environ]
      path: [backend.agents.business_analysis_agent, backend.agents.agent, backend.agents.marketing_orchestrator, backend.agents.adk_visual_agents,
        'os.path.join(os.path.dirname(__file__), ''../.env'')']
  GEMINI_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.agents.business_analysis_agent, backend.api.routes.campaigns, backend.agents.agent, backend.agents.marketing_orchestrator,
        backend.agents.adk_visual_agents, 'os.path.join(os.path.dirname(__file__), ''../.env'')']
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, genai.Client]
      path: [backend.api.routes.campaigns, backend.agents.adk_visual_agents]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.agents.adk_visual_agents]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.agents.adk_visual_agents]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.agents.adk_visual_agents]
  IMAGE_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.agents.adk_visual_agents]
  LOG_FILE:
    type: env
    params:
      caller: [os.getenv]
      path: ['os.path.join(os.path.dirname(__file__), ''../.env'')']
  LOG_LEVEL:
    type: env
    params:
      caller: [os.getenv]
      path: ['os.path.join(os.path.dirname(__file__), ''../.env'')']
  VIDEO_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.agents.adk_visual_agents]

files:
  ../.env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../.env]
  data/images/generated:
    type: literal
    actions: [read]
    params:
      caller: [_create_fallback_image_file]
  data/videos/generated:
    type: literal
    actions: [read]
    params:
      caller: [_create_fallback_video_file]
  image_path:
    type: variable
    actions: [read]
    params:
      caller: [img.save]
  images_dir:
    type: variable
    actions: [write]
    params:
      caller: [images_dir.mkdir]
  video_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [video_file]
  videos_dir:
    type: variable
    actions: [write]
    params:
      caller: [videos_dir.mkdir]

networks:
  localhost:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://localhost:8000/api/v1/content/images/{campaign_id}/{image_filename}
      caller: [_create_fallback_image_file]
  localhost.1:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://localhost:8000/api/v1/content/videos/{campaign_id}/{video_filename}
      caller: [_create_fallback_video_file]
  post_url:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{post_url}
      caller: [_generate_batch_content_with_gemini, _generate_fallback_posts]
      dynamic: "True"
      variable: post_url
